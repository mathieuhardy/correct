[package]
name = "correct"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe      = "0.37"
egui        = "0.37"
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"
serde_json  = "1"
reqwest     = { version = "0.12", features = ["json", "blocking"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
walkdir     = "2"
fontdb      = "0.22"
rfd         = "0.15"
dirs        = "7"
